- name: Module 5 Validate
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    policy_ns: policies-autoshift
  tasks:
    - name: Read the resolved config for local-cluster
      ansible.builtin.command: >-
        oc get configmap local-cluster.rendered-config -n {{ policy_ns }} -o jsonpath={.data.config}
      register: rc
      changed_when: false
      failed_when: false

    - name: Parse it
      ansible.builtin.set_fact:
        cfg: "{{ rc.stdout | default('{}') | from_yaml }}"
      failed_when: false

    - name: Read the uwm label
      ansible.builtin.shell: >-
        oc get managedcluster local-cluster --show-labels --no-headers
        | tr ',' '\n' | sed -n 's|^autoshift.io/uwm=||p'
      register: uwm
      changed_when: false
      failed_when: false

    # A single validation_check per module. The action plugin accepts only
    # pass_msg/error_msg (never msg) and returns on the first failing check, so
    # every condition is folded into one check and the detail goes into one
    # report. buttons.js turns each ✅/❌ line into a step chip.
    - name: Evaluate the checks
      ansible.builtin.set_fact:
        _rc_ok: "{{ rc.rc == 0 }}"
        _uwm_block_ok: "{{ cfg.uwm is defined }}"
        _retention_ok: "{{ (cfg.uwm.prometheus.retention | default('')) in ['7d', '24h'] }}"
        _storage_ok: "{{ (cfg.uwm.prometheus.storage | default('')) == '10Gi' }}"
        _label_ok: "{{ uwm.stdout == 'true' }}"

    - name: Build the report
      ansible.builtin.set_fact:
        _report: |
          {{ '✅' if _rc_ok else '❌' }} The rendered-config ConfigMap exists for local-cluster
          {{ '✅' if _uwm_block_ok else '❌' }} The uwm config block reached rendered-config
          {{ '✅' if _retention_ok else '❌' }} uwm.prometheus.retention resolved through the merge ({{ cfg.uwm.prometheus.retention | default('unset') }} — 7d with the per-cluster override applied, 24h after you clean it up)
          {{ '✅' if _storage_ok else '❌' }} The clusterset value survived the merge (uwm.prometheus.storage is {{ cfg.uwm.prometheus.storage | default('unset') }}, expected 10Gi)
          {{ '✅' if _label_ok else '❌' }} The uwm label is stamped on local-cluster (found: {{ uwm.stdout | default('absent') or 'absent' }})

    - validation_check:
        check: "{{ _rc_ok and _uwm_block_ok and _retention_ok and _storage_ok and _label_ok }}"
        pass_msg: "{{ _report }}"
        error_msg: "{{ _report }}"
