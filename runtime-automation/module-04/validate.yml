- name: Module 4 Validate
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    policy_ns: policies-autoshift
  tasks:
    - name: Read the node-feature-discovery label on local-cluster
      ansible.builtin.shell: >-
        oc get managedcluster local-cluster --show-labels --no-headers
        | tr ',' '\n' | sed -n 's|^autoshift.io/node-feature-discovery=||p'
      register: nfd
      changed_when: false
      failed_when: false

    - name: Read the NFD operator CSV phase
      ansible.builtin.shell: >-
        oc get csv -n openshift-nfd --no-headers 2>/dev/null
        | awk '/^nfd\./ {print $NF}' | head -1
      register: csv
      changed_when: false
      failed_when: false

    - name: Read the clusters the NFD placement selected
      ansible.builtin.shell: >-
        oc get placementdecision -n {{ policy_ns }}
        -l cluster.open-cluster-management.io/placement=placement-policy-node-feature-discovery
        -o jsonpath='{range .items[*]}{range .status.decisions[*]}{.clusterName}{"\n"}{end}{end}'
      register: placed
      changed_when: false
      failed_when: false

    # A single validation_check per module. The action plugin accepts only
    # pass_msg/error_msg (never msg) and returns on the first failing check, so
    # every condition is folded into one check and the detail goes into one
    # report. buttons.js turns each ✅/❌ line into a step chip.
    - name: Evaluate the checks
      ansible.builtin.set_fact:
        _nfd_ok: "{{ nfd.stdout | default('') | length > 0 }}"
        _csv_ok: "{{ csv.stdout == 'Succeeded' }}"
        _placed_ok: "{{ nfd.stdout != 'true' or 'local-cluster' in (placed.stdout | default('')) }}"

    - name: Build the report
      ansible.builtin.set_fact:
        _report: |
          {{ '✅' if _nfd_ok else '❌' }} The node-feature-discovery label is declared (value: {{ nfd.stdout | default('absent') or 'absent' }})
          {{ '✅' if _csv_ok else '❌' }} The NFD operator installed (CSV phase: {{ csv.stdout | default('absent') or 'absent' }})
          {{ '✅' if _placed_ok else '❌' }} Placement matches the label state (label={{ nfd.stdout | default('absent') or 'absent' }}, placed on: {{ placed.stdout_lines | default([]) | join(', ') or 'none' }})

    - validation_check:
        check: "{{ _nfd_ok and _csv_ok and _placed_ok }}"
        pass_msg: "{{ _report }}"
        error_msg: "{{ _report }}"
