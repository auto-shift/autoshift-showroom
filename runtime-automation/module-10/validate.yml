- name: Module 10 Validate
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Look for a remaining spoke ClusterDeployment
      ansible.builtin.shell: "oc get clusterdeployment -A --no-headers 2>/dev/null | wc -l | tr -d ' '"
      register: cd
      changed_when: false
      failed_when: false

    - name: Look for a remaining spoke ManagedCluster
      ansible.builtin.shell: "oc get managedcluster --no-headers | awk '$1!=\"local-cluster\"' | wc -l | tr -d ' '"
      register: mc
      changed_when: false
      failed_when: false

    - name: Confirm the hub itself is still managed
      ansible.builtin.command: oc get managedcluster local-cluster -o name
      register: hub
      changed_when: false
      failed_when: false

    # A single validation_check per module. The action plugin accepts only
    # pass_msg/error_msg (never msg) and returns on the first failing check, so
    # every condition is folded into one check and the detail goes into one
    # report. buttons.js turns each ✅/❌ line into a step chip.
    - name: Evaluate the checks
      ansible.builtin.set_fact:
        _cd_ok: "{{ (cd.stdout | default('0') | int) == 0 }}"
        _mc_ok: "{{ (mc.stdout | default('0') | int) == 0 }}"
        _hub_ok: "{{ hub.rc == 0 }}"

    - name: Build the report
      ansible.builtin.set_fact:
        _report: |
          {{ '✅' if _cd_ok else '❌' }} No ClusterDeployment remains, so the spoke was torn down and billing stopped ({{ cd.stdout | default('?') }} found)
          {{ '✅' if _mc_ok else '❌' }} No spoke ManagedCluster remains on the hub ({{ mc.stdout | default('?') }} found)
          {{ '✅' if _hub_ok else '❌' }} The hub itself is still registered as local-cluster

    - validation_check:
        check: "{{ _cd_ok and _mc_ok and _hub_ok }}"
        pass_msg: "{{ _report }}"
        error_msg: "{{ _report }}"
