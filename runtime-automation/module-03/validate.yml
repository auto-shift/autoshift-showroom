- name: Module 3 Validate
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Count keys in the cluster-install source secret
      ansible.builtin.shell: >-
        oc get secret aws-creds -n cluster-install-secrets -o jsonpath='{.data}'
        | grep -o '"[a-zA-Z_-]*":' | wc -l
      register: keys
      changed_when: false
      failed_when: false

    - name: Read the registry labels stamped on local-cluster
      ansible.builtin.shell: >-
        oc get managedcluster local-cluster --show-labels --no-headers
        | tr ',' '\n' | grep -cE '^autoshift.io/(odf|quay)='
      register: reglabels
      changed_when: false
      failed_when: false

    - name: Read the StorageCluster phase
      ansible.builtin.command: >-
        oc get storagecluster ocs-storagecluster -n openshift-storage -o jsonpath={.status.phase}
      register: sc
      changed_when: false
      failed_when: false

    - name: Read the QuayRegistry availability
      ansible.builtin.shell: >-
        oc get quayregistry registry -n quay-enterprise
        -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
      register: quay
      changed_when: false
      failed_when: false

    - name: Look for the spoke ClusterDeployment
      ansible.builtin.command: oc get clusterdeployment spoke-aws-1 -n spoke-aws-1 -o name
      register: cd
      changed_when: false
      failed_when: false

    # A single validation_check per module. The action plugin accepts only
    # pass_msg/error_msg (never msg) and returns on the first failing check, so
    # every condition is folded into one check and the detail goes into one
    # report. buttons.js turns each ✅/❌ line into a step chip.
    - name: Evaluate the checks
      ansible.builtin.set_fact:
        _keys_ok: "{{ (keys.stdout | default('0') | int) >= 5 }}"
        _reglabels_ok: "{{ (reglabels.stdout | default('0') | int) >= 2 }}"
        _sc_ok: "{{ sc.stdout == 'Ready' }}"
        _quay_ok: "{{ quay.stdout == 'True' }}"
        _cd_ok: "{{ cd.rc == 0 }}"

    - name: Build the report
      ansible.builtin.set_fact:
        _report: |
          {{ '✅' if _keys_ok else '❌' }} Secret aws-creds holds all 5 keys ({{ keys.stdout | default(0) }} found)
          {{ '✅' if _reglabels_ok else '❌' }} The odf and quay labels reached local-cluster ({{ reglabels.stdout | default(0) }} of 2)
          {{ '✅' if _sc_ok else '❌' }} StorageCluster is Ready (found: {{ sc.stdout | default('absent') or 'absent' }})
          {{ '✅' if _quay_ok else '❌' }} QuayRegistry is Available (found: {{ quay.stdout | default('absent') or 'absent' }})
          {{ '✅' if _cd_ok else '❌' }} ClusterDeployment spoke-aws-1 was created

    - validation_check:
        check: "{{ _keys_ok and _reglabels_ok and _sc_ok and _quay_ok and _cd_ok }}"
        pass_msg: "{{ _report }}"
        error_msg: "{{ _report }}"
