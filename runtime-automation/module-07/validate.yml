- name: Module 7 Validate
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    # Module 7 is entirely local: the student scaffolds policies/stable/web-terminal/
    # in their clone of autoshiftv2, renders it with kustomize, runs the integration
    # test, and edits autoshift/values/clustersets/_example.yaml. None of that
    # reaches the cluster and none of it is pushed, so there is no cluster-side or
    # remote surface to check.
    #
    # The checks it needs would have to read that clone. They cannot: the runner
    # container mounts only /app/runtime-automation, /app/artifacts and /app/logs
    # (charts/zerotouch/templates/deployment.yaml in rhpds/showroom-deployer),
    # while the student's shell has its home on the separate terminal-lab-user-home
    # volume. A validate that reads the filesystem here fails for every student
    # regardless of their work.
    #
    # Restore the real checks once the runner mounts the student's home. Until
    # then, say so rather than showing a check that cannot pass.
    - validation_check:
        check: "{{ true }}"
        pass_msg: "✅ No automated validation for this module — the runner cannot read your local clone. Work through the Verify sections on the page."
        error_msg: "❌ unreachable"
