- name: Module 1 Validate
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    policy_ns: policies-autoshift
  tasks:
    - name: Read MultiClusterHub phase
      ansible.builtin.command: >-
        oc get multiclusterhub multiclusterhub -n open-cluster-management
        -o jsonpath={.status.phase}
      register: mch
      changed_when: false
      failed_when: false

    - name: Read GitOps repo server availability
      ansible.builtin.command: >-
        oc get deploy infra-gitops-repo-server -n openshift-gitops
        -o jsonpath={.status.availableReplicas}
      register: repo
      changed_when: false
      failed_when: false

    - name: Read the AutoShift ApplicationSet
      ansible.builtin.command: oc get applicationset autoshift-policies -n openshift-gitops -o name
      register: appset
      changed_when: false
      failed_when: false

    - name: Count Applications the ApplicationSet produced
      ansible.builtin.command: >-
        oc get applications.argoproj.io -n openshift-gitops
        -l app=autoshift-policies -o name
      register: apps
      changed_when: false
      failed_when: false

    - name: Count policies in the policy namespace
      ansible.builtin.command: oc get policy -n {{ policy_ns }} -o name
      register: policies
      changed_when: false
      failed_when: false

    # A single validation_check per module. The action plugin accepts only
    # pass_msg/error_msg (never msg) and returns on the first failing check, so
    # every condition is folded into one check and the detail goes into one
    # report. buttons.js turns each ✅/❌ line into a step chip.
    - name: Evaluate the checks
      ansible.builtin.set_fact:
        _mch_ok: "{{ mch.stdout == 'Running' }}"
        _repo_ok: "{{ (repo.stdout | default('0') | int) > 0 }}"
        _appset_ok: "{{ appset.rc == 0 }}"
        _apps_ok: "{{ (apps.stdout_lines | default([]) | length) > 0 }}"
        _policies_ok: "{{ (policies.stdout_lines | default([]) | length) > 0 }}"

    - name: Build the report
      ansible.builtin.set_fact:
        _report: |
          {{ '✅' if _mch_ok else '❌' }} MultiClusterHub is Running (found: {{ mch.stdout | default('absent') }})
          {{ '✅' if _repo_ok else '❌' }} OpenShift GitOps repo server is available (replicas: {{ repo.stdout | default('0') }})
          {{ '✅' if _appset_ok else '❌' }} ApplicationSet autoshift-policies exists
          {{ '✅' if _apps_ok else '❌' }} ApplicationSet produced Applications ({{ apps.stdout_lines | default([]) | length }} found)
          {{ '✅' if _policies_ok else '❌' }} Policies exist in {{ policy_ns }} ({{ policies.stdout_lines | default([]) | length }} found)

    - validation_check:
        check: "{{ _mch_ok and _repo_ok and _appset_ok and _apps_ok and _policies_ok }}"
        pass_msg: "{{ _report }}"
        error_msg: "{{ _report }}"
