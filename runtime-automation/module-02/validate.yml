- name: Module 2 Validate
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    policy_ns: policies-autoshift
  tasks:
    - name: Read the clusterset assignment on local-cluster
      ansible.builtin.shell: >-
        oc get managedcluster local-cluster --show-labels --no-headers
        | tr ',' '\n' | sed -n 's/^cluster.open-cluster-management.io\/clusterset=//p'
      register: cs
      changed_when: false
      failed_when: false

    - name: Read the autoshift.io labels stamped on local-cluster
      ansible.builtin.shell: >-
        oc get managedcluster local-cluster -o json | grep -c '"autoshift.io/'
      register: stamped
      changed_when: false
      failed_when: false

    - name: Read the clusterset ConfigMap the labels come from
      ansible.builtin.command: oc get configmap cluster-set.hub -n {{ policy_ns }} -o name
      register: cm
      changed_when: false
      failed_when: false

    - name: Read the cluster-labels policy compliance
      ansible.builtin.command: >-
        oc get policy policy-selfmanagedhub-labels -n {{ policy_ns }}
        -o jsonpath={.status.compliant}
      register: pol
      changed_when: false
      failed_when: false

    # A single validation_check per module. The action plugin accepts only
    # pass_msg/error_msg (never msg) and returns on the first failing check, so
    # every condition is folded into one check and the detail goes into one
    # report. buttons.js turns each ✅/❌ line into a step chip.
    - name: Evaluate the checks
      ansible.builtin.set_fact:
        _cs_ok: "{{ cs.stdout == 'hub' }}"
        _stamped_ok: "{{ (stamped.stdout | default('0') | int) > 0 }}"
        _cm_ok: "{{ cm.rc == 0 }}"
        _pol_ok: "{{ pol.stdout == 'Compliant' }}"

    - name: Build the report
      ansible.builtin.set_fact:
        _report: |
          {{ '✅' if _cs_ok else '❌' }} local-cluster is assigned to the hub clusterset (found: {{ cs.stdout | default('unassigned') or 'unassigned' }})
          {{ '✅' if _stamped_ok else '❌' }} autoshift.io labels are stamped on local-cluster ({{ stamped.stdout | default(0) }} found)
          {{ '✅' if _cm_ok else '❌' }} ConfigMap cluster-set.hub exists in {{ policy_ns }}
          {{ '✅' if _pol_ok else '❌' }} policy-selfmanagedhub-labels is Compliant (found: {{ pol.stdout | default('none') or 'none' }})

    - validation_check:
        check: "{{ _cs_ok and _stamped_ok and _cm_ok and _pol_ok }}"
        pass_msg: "{{ _report }}"
        error_msg: "{{ _report }}"
